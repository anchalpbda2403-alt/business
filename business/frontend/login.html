<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - GramBiz AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="bg-gradient-soft" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">
    <video class="background-video" autoplay muted loop playsinline>
    <source src="videos/login-bg.mp4" type="video/mp4">
    </video>
  <div class="card" style="width: 100%; max-width: 440px; padding: 2.5rem; border-radius: var(--radius-xl);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <p class="text-muted" style="font-size: 0.9rem;">Welcome back! Sign in to access your dashboard.</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="loginIdentifier">Email or Mobile Number</label>
        <div style="position: relative;">
          <input type="text" id="loginIdentifier" class="form-control" placeholder="e.g. 9876543210 or user@example.com" required style="padding-left: 2.5rem;">
          <i class="fas fa-user" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--neutral-400);"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <div style="position: relative;">
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required style="padding-left: 2.5rem;">
          <i class="fas fa-lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--neutral-400);"></i>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.85rem;">
        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
          <input type="checkbox" id="rememberMe"> Remember me
        </label>
        <a href="#" style="color: var(--primary-700); font-weight: 600;">Forgot Password?</a>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem;"><i class="fas fa-sign-in-alt"></i> Login</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--neutral-600);">
      Don't have an account? <a href="signup.html" style="font-weight: 700;">Sign Up</a>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

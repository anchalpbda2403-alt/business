<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrepreneur Onboarding - GramBiz AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="bg-gradient-soft" style="padding: 2rem 1rem;">

  <div class="container" style="max-width: 800px;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h2>Entrepreneur Profile Setup</h2>
      <p class="text-muted">Tell us about your business so our AI can customize financial insights for you.</p>
    </div>

    <div class="card p-4" style="border-radius: var(--radius-xl);">
      <form id="onboardingForm">
        
        <!-- Step 1: Personal Info -->
        <div style="border-bottom: 1px solid var(--neutral-200); padding-bottom: 1.5rem; margin-bottom: 1.5rem;">
          <h4 style="color: var(--primary-800); margin-bottom: 1rem;"><i class="fas fa-user me-2"></i>1. Personal & Location Details</h4>
          
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label" for="obName">Full Name</label>
              <input type="text" id="obName" class="form-control" placeholder="Your Name" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="obVillage">Village / Town</label>
              <input type="text" id="obVillage" class="form-control" placeholder="Village name">
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label" for="obDistrict">District</label>
              <input type="text" id="obDistrict" class="form-control" placeholder="District name">
            </div>
            <div class="form-group">
              <label class="form-label" for="obState">State</label>
              <input type="text" id="obState" class="form-control" placeholder="State">
            </div>
          </div>
        </div>

        <!-- Step 2: Business Info -->
        <div style="border-bottom: 1px solid var(--neutral-200); padding-bottom: 1.5rem; margin-bottom: 1.5rem;">
          <h4 style="color: var(--primary-800); margin-bottom: 1rem;"><i class="fas fa-store me-2"></i>2. Business Profile</h4>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label" for="obBusinessType">Business Type</label>
              <select id="obBusinessType" class="form-select">
                <option value="Dairy Products">Dairy Products</option>
                <option value="Food Processing">Food Processing</option>
                <option value="Tailoring & Boutique">Tailoring & Boutique</option>
                <option value="Handicrafts">Handicrafts</option>
                <option value="Agricultural Services">Agricultural Services</option>
                <option value="Grocery/Kirana">Grocery/Kirana</option>
                <option value="Repair Services">Repair Services</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="obStatus">Current Status</label>
              <select id="obStatus" class="form-select">
                <option value="Planning">Planning to Start</option>
                <option value="Operational">Currently Operational</option>
                <option value="Expanding">Expanding Operations</option>
              </select>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label" for="obYears">Years in Business</label>
              <input type="number" step="0.5" id="obYears" class="form-control" value="1">
            </div>
            <div class="form-group">
              <label class="form-label" for="obWorkers">Number of Workers</label>
              <input type="number" id="obWorkers" class="form-control" value="2">
            </div>
          </div>
        </div>

        <!-- Step 3: Financial Overview -->
        <div style="border-bottom: 1px solid var(--neutral-200); padding-bottom: 1.5rem; margin-bottom: 1.5rem;">
          <h4 style="color: var(--primary-800); margin-bottom: 1rem;"><i class="fas fa-wallet me-2"></i>3. Financial Overview (₹)</h4>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label" for="obInvestment">Initial Investment Setup (₹)</label>
              <input type="number" id="obInvestment" class="form-control" value="100000">
            </div>
            <div class="form-group">
              <label class="form-label" for="obRevenue">Monthly Revenue (₹)</label>
              <input type="number" id="obRevenue" class="form-control" value="40000">
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem;">
            <div class="form-group">
              <label class="form-label" for="obExpenses">Monthly Expenses (₹)</label>
              <input type="number" id="obExpenses" class="form-control" value="25000">
            </div>
            <div class="form-group">
              <label class="form-label" for="obSavings">Current Savings (₹)</label>
              <input type="number" id="obSavings" class="form-control" value="15000">
            </div>
            <div class="form-group">
              <label class="form-label" for="obLoan">Existing Loan (₹)</label>
              <input type="number" id="obLoan" class="form-control" value="0">
            </div>
          </div>
        </div>

        <!-- Step 4: Goals -->
        <div style="margin-bottom: 2rem;">
          <h4 style="color: var(--primary-800); margin-bottom: 1rem;"><i class="fas fa-bullseye me-2"></i>4. Primary Business Goals</h4>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.75rem;">
            <label class="chip"><input type="checkbox" name="goals" value="Start a Business" checked> Start a business</label>
            <label class="chip"><input type="checkbox" name="goals" value="Increase Sales" checked> Increase sales</label>
            <label class="chip"><input type="checkbox" name="goals" value="Reduce Expenses"> Reduce expenses</label>
            <label class="chip"><input type="checkbox" name="goals" value="Expand Business"> Expand business</label>
            <label class="chip"><input type="checkbox" name="goals" value="Get Funding"> Get funding</label>
            <label class="chip"><input type="checkbox" name="goals" value="Improve Cash Flow" checked> Improve cash flow</label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;"><i class="fas fa-check-circle"></i> Save & Go to Dashboard</button>
      </form>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

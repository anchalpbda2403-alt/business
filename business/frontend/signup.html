<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - GramBiz AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="bg-gradient-soft" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 1.5rem;">

  <div class="card" style="width: 100%; max-width: 580px; padding: 2.5rem; border-radius: var(--radius-xl);">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <p class="text-muted" style="font-size: 0.9rem;">Join thousands of rural entrepreneurs growing with AI.</p>
    </div>

    <form id="signupForm">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label class="form-label" for="signupFullName">Full Name *</label>
          <input type="text" id="signupFullName" class="form-control" placeholder="e.g. Rajesh Kumar" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="signupMobile">Mobile Number *</label>
          <input type="tel" id="signupMobile" class="form-control" placeholder="10-digit mobile" required>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label class="form-label" for="signupEmail">Email Address *</label>
          <input type="email" id="signupEmail" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="signupPassword">Password *</label>
          <input type="password" id="signupPassword" class="form-control" placeholder="••••••••" required>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem;">
        <div class="form-group">
          <label class="form-label" for="signupVillage">Village / Town</label>
          <input type="text" id="signupVillage" class="form-control" placeholder="Village name">
        </div>

        <div class="form-group">
          <label class="form-label" for="signupDistrict">District</label>
          <input type="text" id="signupDistrict" class="form-control" placeholder="District">
        </div>

        <div class="form-group">
          <label class="form-label" for="signupState">State</label>
          <input type="text" id="signupState" class="form-control" placeholder="State">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="signupBusinessType">Business Category / Type</label>
        <select id="signupBusinessType" class="form-select">
          <option value="Dairy & Livestock">Dairy & Livestock</option>
          <option value="Food Processing & Flour Mill">Food Processing & Flour Mill</option>
          <option value="Tailoring & Garments">Tailoring & Garments</option>
          <option value="Handicrafts & Handloom">Handicrafts & Handloom</option>
          <option value="Agriculture Services & Equipment">Agriculture Services & Equipment</option>
          <option value="Grocery / Kirana Store">Grocery / Kirana Store</option>
          <option value="Solar & Electronics Repair">Solar & Electronics Repair</option>
          <option value="Other Micro Enterprise">Other Micro Enterprise</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; margin-top: 0.5rem;"><i class="fas fa-user-plus"></i> Create Account</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--neutral-600);">
      Already have an account? <a href="login.html" style="font-weight: 700;">Login here</a>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
